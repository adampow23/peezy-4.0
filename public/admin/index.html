  <style>
    :root {
      --deep-ink: #0D1A33;
      --deep-ink-soft: #E8EBF1;
      --background: #F4F5F7;
      --surface: #FFFFFF;
      --surface-muted: #F8F9FA;
      --border: #E1E4E9;
      --border-strong: #CAD0D9;
      --text: #1B1D29;
      --text-muted: #697180;
      --text-faint: #9299A5;
      --danger: #B42318;
      --danger-soft: #FEECEB;
      --success: #287A50;
      --success-soft: #E8F5ED;
      --shadow: 0 16px 45px rgba(13, 26, 51, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background: var(--background);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(13, 26, 51, 0.22);
      outline-offset: 2px;
    }

    .centered-screen {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(13, 26, 51, 0.09), transparent 38%),
        var(--background);
    }

    .auth-card {
      width: min(100%, 410px);
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .wordmark {
      margin: 0;
      color: var(--deep-ink);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.06em;
    }

    .auth-kicker {
      margin: 5px 0 28px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .auth-title {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -0.025em;
    }

    .auth-copy {
      margin: 0 0 24px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 15px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 650;
      transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    .primary-button {
      color: #FFFFFF;
      background: var(--deep-ink);
    }

    .primary-button:not(:disabled):hover {
      background: #182B4D;
      transform: translateY(-1px);
    }

    .secondary-button {
      color: var(--deep-ink);
      border: 1px solid var(--border-strong);
      background: var(--surface);
    }

    .secondary-button:not(:disabled):hover {
      border-color: var(--deep-ink);
      background: var(--surface-muted);
    }

    .danger-button {
      color: var(--danger);
      border: 1px solid #F4C7C3;
      background: var(--danger-soft);
    }

    .wide-button {
      width: 100%;
    }

    .google-mark {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--deep-ink);
      background: #FFFFFF;
      font-weight: 700;
    }

    .notice {
      margin: 16px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      color: var(--text-muted);
      background: var(--surface-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .notice.error {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .inbox {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(300px, 370px) minmax(0, 1fr);
      background: var(--background);
    }

    .thread-sidebar {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }

    .sidebar-header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-title-row,
    .thread-title-row,
    .toolbar,
    .filter-tabs,
    .sender-line {
      display: flex;
      align-items: center;
    }

    .sidebar-title-row {
      justify-content: space-between;
      gap: 12px;
    }

    .sidebar-title {
      margin: 0;
      color: var(--deep-ink);
      font-size: 22px;
      letter-spacing: -0.04em;
    }

    .sidebar-subtitle {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--deep-ink);
      background: var(--surface);
    }

    .icon-button:hover {
      border-color: var(--border-strong);
      background: var(--surface-muted);
    }

    .icon-button.spinning svg {
      animation: spin 800ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .filter-tabs {
      gap: 4px;
      margin-top: 18px;
      padding: 4px;
      border-radius: 11px;
      background: var(--background);
    }

    .filter-tab {
      min-height: 34px;
      flex: 1;
      padding: 6px 10px;
      border-radius: 8px;
      color: var(--text-muted);
      background: transparent;
      font-size: 12px;
      font-weight: 600;
    }

    .filter-tab.active {
      color: var(--deep-ink);
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(13, 26, 51, 0.09);
    }

    .list-error {
      margin: 12px 14px 0;
      padding: 10px 12px;
      border-radius: 9px;
      color: var(--danger);
      background: var(--danger-soft);
      font-size: 12px;
      line-height: 1.45;
    }

    .thread-list {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
    }

    .list-state {
      min-height: 180px;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
    }

    .thread-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      border-left: 3px solid transparent;
      text-align: left;
      background: var(--surface);
    }

    .thread-row:hover {
      background: var(--surface-muted);
    }

    .thread-row.selected {
      border-left-color: var(--deep-ink);
      background: #F0F2F6;
    }

    .thread-name {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thread-time {
      color: var(--text-faint);
      font-size: 11px;
      white-space: nowrap;
    }

    .thread-preview {
      min-width: 0;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-prefix {
      color: var(--deep-ink);
      font-weight: 600;
    }

    .row-badges {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .status-chip,
    .unread-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .status-chip {
      min-height: 22px;
      padding: 3px 8px;
      color: var(--deep-ink);
      background: var(--deep-ink-soft);
      text-transform: capitalize;
    }

    .status-chip.resolved {
      color: var(--success);
      background: var(--success-soft);
    }

    .unread-badge {
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      color: #FFFFFF;
      background: var(--deep-ink);
    }

    .account-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
    }

    .account-email {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .text-button {
      padding: 5px;
      color: var(--deep-ink);
      background: transparent;
      font-size: 11px;
      font-weight: 650;
    }

    .thread-pane {
      min-width: 0;
      min-height: 0;
      background: var(--background);
    }

    .empty-thread {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 30px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-thread-card {
      max-width: 340px;
    }

    .empty-thread-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--deep-ink);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .empty-thread h2 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 18px;
    }

    .empty-thread p {
      margin: 0;
      font-size: 13px;
      line-height: 1.55;
    }

    .thread-view {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }

    .thread-header {
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .back-button {
      display: none;
    }

    .thread-heading {
      min-width: 0;
      flex: 1;
    }

    .thread-title-row {
      min-width: 0;
      gap: 8px;
    }

    .thread-title {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: 17px;
      letter-spacing: -0.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thread-uid {
      margin: 4px 0 0;
      overflow: hidden;
      color: var(--text-faint);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar {
      gap: 8px;
    }

    .thread-grid {
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 280px);
    }

    .conversation {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface-muted);
    }

    .messages {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      padding: 24px clamp(18px, 4vw, 46px);
    }

    .message-wrap {
      width: min(78%, 660px);
      align-self: flex-start;
    }

    .message-wrap.user {
      align-self: flex-end;
    }

    .message-bubble {
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 15px 15px 15px 4px;
      color: var(--text);
      background: var(--surface);
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      box-shadow: 0 3px 12px rgba(13, 26, 51, 0.04);
    }

    .message-wrap.user .message-bubble {
      border-color: var(--deep-ink);
      border-radius: 15px 15px 4px 15px;
      color: #FFFFFF;
      background: var(--deep-ink);
    }

    .sender-line {
      justify-content: space-between;
      gap: 12px;
      margin-top: 5px;
      color: var(--text-faint);
      font-size: 10px;
    }

    .message-wrap.user .sender-line {
      flex-direction: row-reverse;
    }

    .composer {
      padding: 14px 18px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .composer textarea {
      width: 100%;
      min-height: 82px;
      max-height: 180px;
      display: block;
      resize: vertical;
      padding: 12px 13px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      color: var(--text);
      background: var(--surface);
      font-size: 14px;
      line-height: 1.5;
    }

    .composer textarea::placeholder {
      color: var(--text-faint);
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 9px;
    }

    .composer-hint {
      color: var(--text-faint);
      font-size: 10px;
    }

    .context-panel {
      min-width: 0;
      overflow-y: auto;
      padding: 22px 20px;
      border-left: 1px solid var(--border);
      background: var(--surface);
    }

    .context-title {
      margin: 0 0 16px;
      color: var(--deep-ink);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .context-list {
      display: grid;
      gap: 15px;
      margin: 0;
    }

    .context-item {
      min-width: 0;
    }

    .context-item dt {
      margin: 0 0 4px;
      color: var(--text-faint);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .context-item dd {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .context-item dd.muted {
      color: var(--text-muted);
    }

    .task-context {
      padding: 11px 12px;
      border-radius: 10px;
      color: var(--deep-ink);
      background: var(--deep-ink-soft);
    }

    .task-id {
      display: block;
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 10px;
    }

    .inline-error {
      margin: 0 18px 12px;
      padding: 10px 12px;
      border-radius: 9px;
      color: var(--danger);
      background: var(--danger-soft);
      font-size: 12px;
      line-height: 1.45;
    }

    .loading-thread {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    .loading-dot {
      width: 7px;
      height: 7px;
      display: inline-block;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--deep-ink);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        opacity: 0.35;
      }
    }

    @media (max-width: 900px) {
      .thread-grid {
        grid-template-columns: minmax(0, 1fr) 220px;
      }

      .context-panel {
        padding: 20px 16px;
      }
    }

    @media (max-width: 700px) {
      .inbox {
        display: block;
      }

      .thread-sidebar,
      .thread-pane {
        width: 100%;
        height: 100%;
      }

      .inbox.has-selection .thread-sidebar {
        display: none;
      }

      .inbox:not(.has-selection) .thread-pane {
        display: none;
      }

      .back-button {
        display: grid;
      }

      .thread-header {
        min-height: 68px;
        padding: 10px 12px;
      }

      .thread-header .secondary-button,
      .thread-header .danger-button {
        min-height: 38px;
        padding: 7px 10px;
        font-size: 12px;
      }

      .thread-grid {
        display: flex;
        flex-direction: column;
      }

      .context-panel {
        order: -1;
        max-height: 190px;
        flex: 0 0 auto;
        overflow-y: auto;
        padding: 13px 15px;
        border-left: 0;
        border-bottom: 1px solid var(--border);
      }

      .context-title {
        margin-bottom: 10px;
      }

      .context-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 16px;
      }

      .messages {
        padding: 18px 14px;
      }

      .message-wrap {
        width: 88%;
      }

      .composer {
        padding: 11px 12px calc(12px + env(safe-area-inset-bottom));
      }

      .composer-hint {
        display: none;
      }

      .auth-card {
        padding: 28px 24px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useCallback, useEffect, useRef, useState } = React;

    const firebaseConfigReady = Object.values(firebaseConfig)
      .every(value => typeof value === "string" && value && !value.startsWith("TODO_"));

    let auth = null;
    let supportFunctions = null;
    let adminListThreads = null;
    let adminGetThread = null;
    let adminReplySupport = null;
    let adminSetThreadStatus = null;

    if (firebaseConfigReady) {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      supportFunctions = firebase.app().functions("us-central1");
      adminListThreads = supportFunctions.httpsCallable("adminListThreads");
      adminGetThread = supportFunctions.httpsCallable("adminGetThread");
      adminReplySupport = supportFunctions.httpsCallable("adminReplySupport");
      adminSetThreadStatus = supportFunctions.httpsCallable("adminSetThreadStatus");
    }

    function Icon({ name, size = 18 }) {
      const paths = {
        arrow: <path d="M15 12H5m4-4-4 4 4 4"/>,
        chat: <path d="M5 17.5 2.5 20v-4A8.5 8.5 0 1 1 6 19.2M7 9h10M7 13h7"/>,
        refresh: <path d="M20 6v5h-5M4 18v-5h5M6.1 8a7 7 0 0 1 11.4-2.1L20 8M4 16l2.5 2.1A7 7 0 0 0 17.9 16"/>,
        send: <path d="m21 3-7.2 18-4.1-7.7L2 9.2 21 3Zm-11.3 10.3L14 9"/>,
        shield: <path d="M12 22s8-3.8 8-10V5l-8-3-8 3v7c0 6.2 8 10 8 10Zm-3.3-10 2.2 2.2 4.6-4.7"/>
      };
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"
          aria-hidden="true">
          {paths[name] || null}
        </svg>
      );
    }

    function callableErrorCode(error) {
      return String(error && error.code ? error.code : "").toLowerCase();
    }

    function isPermissionDenied(error) {
      return callableErrorCode(error).endsWith("permission-denied");
    }

    function readableError(error, fallback) {
      const code = callableErrorCode(error);
      if (code.endsWith("unauthenticated")) return "Your session expired. Sign in again.";
      if (code.endsWith("unavailable")) return "Support is temporarily unavailable. Try again.";
      return fallback;
    }

    function asDate(value) {
      if (typeof value === "number") {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? null : date;
      }
      if (typeof value === "string") {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? null : date;
      }
      if (value && typeof value.seconds === "number") {
        return new Date(value.seconds * 1000);
      }
      return null;
    }

    function relativeTime(value) {
      const date = asDate(value);
      if (!date) return "No date";
      const seconds = Math.max(0, Math.round((Date.now() - date.getTime()) / 1000));
      if (seconds < 45) return "now";
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + "m";
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + "h";
      const days = Math.floor(hours / 24);
      if (days < 14) return days + "d";
      const weeks = Math.floor(days / 7);
      if (weeks < 9) return weeks + "w";
      const months = Math.floor(days / 30);
      if (months < 12) return months + "mo";
      return Math.floor(days / 365) + "y";
    }

    function fullDateTime(value) {
      const date = asDate(value);
      if (!date) return "Time unavailable";
      return date.toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function moveDateLabel(value) {
      const date = asDate(value);
      if (!date) return "Not provided";
      return date.toLocaleDateString([], {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    }

    function daysOutLabel(value) {
      if (typeof value !== "number") return "Not available";
      if (value === 0) return "Move day";
      if (value > 0) return value + (value === 1 ? " day out" : " days out");
      const elapsed = Math.abs(value);
      return elapsed + (elapsed === 1 ? " day since move" : " days since move");
    }

    function displayName(thread, detail) {
      const contextName = detail && detail.userContext ? detail.userContext.name : "";
      const name = contextName || (thread ? thread.userName : "");
      if (name) return name;
      const uid = detail ? detail.uid : thread ? thread.uid : "";
      return uid ? uid.slice(0, 8) + "…" : "Unknown user";
    }

    function locationLabel(city, state) {
      return [city, state].filter(Boolean).join(", ") || "Not available";
    }

    function LoginScreen() {
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState("");

      const signIn = async () => {
        if (!auth) return;
        setBusy(true);
        setError("");
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          await auth.signInWithPopup(provider);
        } catch (signInError) {
          const code = String(signInError && signInError.code ? signInError.code : "");
          if (code !== "auth/popup-closed-by-user") {
            setError("Google sign-in failed. Please try again.");
          }
        } finally {
          setBusy(false);
        }
      };

      return (
        <main className="centered-screen">
          <section className="auth-card" aria-labelledby="login-title">
            <p className="wordmark">peezy</p>
            <p className="auth-kicker">Support inbox</p>
            <h1 className="auth-title" id="login-title">Welcome back</h1>
            <p className="auth-copy">
              Sign in with an authorized Peezy Google account to view and answer support messages.
            </p>
            <button className="primary-button wide-button" onClick={signIn}
              disabled={busy || !firebaseConfigReady}>
              <span className="google-mark">G</span>
              {busy ? "Signing in…" : "Continue with Google"}
            </button>
            {!firebaseConfigReady && (
              <p className="notice error">
                Firebase configuration required. Fill the TODO values in this file before hosting it.
              </p>
            )}
            {error && <p className="notice error" role="alert">{error}</p>}
          </section>
        </main>
      );
    }

    function LoadingScreen({ label = "Loading support inbox…" }) {
      return (
        <main className="centered-screen" aria-live="polite">
          <section className="auth-card">
            <p className="wordmark">peezy</p>
            <p className="auth-kicker">Support inbox</p>
            <p className="auth-copy"><span className="loading-dot"></span>{label}</p>
          </section>
        </main>
      );
    }

    function UnauthorizedScreen({ user, onSignOut }) {
      return (
        <main className="centered-screen">
          <section className="auth-card" aria-labelledby="unauthorized-title">
            <p className="wordmark">peezy</p>
            <p className="auth-kicker">Support inbox</p>
            <h1 className="auth-title" id="unauthorized-title">This account isn't authorized.</h1>
            <p className="auth-copy">
              {user.email || "This Google account"} is not on the support admin allowlist.
            </p>
            <button className="secondary-button wide-button" onClick={onSignOut}>
              Use a different account
            </button>
          </section>
        </main>
      );
    }

    function ThreadRow({ thread, selected, onSelect }) {
      const unread = Math.max(0, Number(thread.unreadForAdmin) || 0);
      return (
        <button className={"thread-row" + (selected ? " selected" : "")}
          onClick={() => onSelect(thread.uid)}>
          <span className="thread-name">{displayName(thread)}</span>
          <span className="thread-time">{relativeTime(thread.lastMessageAt)}</span>
          <span className="thread-preview">
            {thread.lastSender === "support" && <span className="preview-prefix">You: </span>}
            {thread.lastMessageText || "No message preview"}
          </span>
          <span className="row-badges">
            {unread > 0 && (
              <span className="unread-badge" aria-label={unread + " unread messages"}>
                {unread > 99 ? "99+" : unread}
              </span>
            )}
            <span className={"status-chip" + (thread.status === "resolved" ? " resolved" : "")}>
              {thread.status === "resolved" ? "Resolved" : "Open"}
            </span>
          </span>
        </button>
      );
    }

    function ThreadList({ user, threads, filter, selectedUid, loading, refreshing, error,
      onFilter, onSelect, onRefresh, onSignOut }) {
      const filters = [
        { key: "open", label: "Open" },
        { key: "resolved", label: "Resolved" },
        { key: "all", label: "All" }
      ];

      return (
        <aside className="thread-sidebar" aria-label="Support threads">
          <header className="sidebar-header">
            <div className="sidebar-title-row">
              <div>
                <h1 className="sidebar-title">peezy support</h1>
                <p className="sidebar-subtitle">Real people, real answers.</p>
              </div>
              <button className={"icon-button" + (refreshing ? " spinning" : "")}
                onClick={onRefresh} disabled={refreshing} aria-label="Refresh support inbox"
                title="Refresh">
                <Icon name="refresh"/>
              </button>
            </div>
            <nav className="filter-tabs" aria-label="Thread status filter">
              {filters.map(item => (
                <button key={item.key}
                  className={"filter-tab" + (filter === item.key ? " active" : "")}
                  onClick={() => onFilter(item.key)}
                  aria-pressed={filter === item.key}>
                  {item.label}
                </button>
              ))}
            </nav>
          </header>
          {error && <p className="list-error" role="alert">{error}</p>}
          <div className="thread-list" aria-busy={loading}>
            {loading ? (
              <div className="list-state"><span><span className="loading-dot"></span>Loading threads…</span></div>
            ) : threads.length === 0 ? (
              <div className="list-state">No {filter === "all" ? "" : filter + " "}threads.</div>
            ) : (
              threads.map(thread => (
                <ThreadRow key={thread.uid} thread={thread}
                  selected={selectedUid === thread.uid} onSelect={onSelect}/>
              ))
            )}
          </div>
          <footer className="account-bar">
            <Icon name="shield" size={15}/>
            <span className="account-email">{user.email || "Signed in"}</span>
            <button className="text-button" onClick={onSignOut}>Sign out</button>
          </footer>
        </aside>
      );
    }

    function ContextPanel({ detail }) {
      const context = detail.userContext || {};
      const task = detail.taskContext;
      return (
        <aside className="context-panel" aria-label="User context">
          <h3 className="context-title">Move context</h3>
          <dl className="context-list">
            <div className="context-item">
              <dt>Name</dt>
              <dd>{context.name || "Not provided"}</dd>
            </div>
            <div className="context-item">
              <dt>Move date</dt>
              <dd>{moveDateLabel(context.moveDate)}</dd>
            </div>
            <div className="context-item">
              <dt>Timing</dt>
              <dd>{daysOutLabel(context.daysUntilMove)}</dd>
            </div>
            <div className="context-item">
              <dt>Current</dt>
              <dd>{locationLabel(context.currentCity, context.currentState)}</dd>
            </div>
            <div className="context-item">
              <dt>Destination</dt>
              <dd>{locationLabel(context.destinationCity, context.destinationState)}</dd>
            </div>
            <div className="context-item">
              <dt>Messaged from</dt>
              <dd className={task ? "task-context" : "muted"}>
                {task && task.title ? task.title : "General support"}
                {task && task.catalogTaskId && (
                  <span className="task-id">{task.catalogTaskId}</span>
                )}
              </dd>
            </div>
          </dl>
        </aside>
      );
    }

    function Conversation({ detail, name, reply, sending, actionError,
      onReplyChange, onSend }) {
      const endRef = useRef(null);

      useEffect(() => {
        endRef.current && endRef.current.scrollIntoView({ block: "end" });
      }, [detail.messages]);

      const onKeyDown = event => {
        if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
          event.preventDefault();
          onSend();
        }
      };

      return (
        <section className="conversation" aria-label="Conversation">
          <div className="messages" aria-live="polite">
            {detail.messages.length === 0 ? (
              <div className="list-state">This conversation has no messages yet.</div>
            ) : detail.messages.map(message => {
              const fromUser = message.sender === "user";
              return (
                <article key={message.id} className={"message-wrap" + (fromUser ? " user" : "")}>
                  <div className="message-bubble">{message.text}</div>
                  <div className="sender-line">
                    <span>{fromUser ? name : message.isAutoResponse ? "Peezy auto-reply" : "Support"}</span>
                    <time dateTime={asDate(message.timestamp)?.toISOString()}>
                      {fullDateTime(message.timestamp)}
                    </time>
                  </div>
                </article>
              );
            })}
            <div ref={endRef}></div>
          </div>
          {actionError && <p className="inline-error" role="alert">{actionError}</p>}
          <div className="composer">
            <textarea value={reply} onChange={event => onReplyChange(event.target.value)}
              onKeyDown={onKeyDown} placeholder={"Reply to " + name + "…"}
              aria-label={"Reply to " + name} disabled={sending}></textarea>
            <div className="composer-footer">
              <span className="composer-hint">⌘ Enter to send</span>
              <button className="primary-button" onClick={onSend}
                disabled={sending || !reply.trim()}>
                <Icon name="send" size={16}/>
                {sending ? "Sending…" : "Send reply"}
              </button>
            </div>
          </div>
        </section>
      );
    }

    function ThreadView({ thread, detail, loading, error, reply, sending, updatingStatus,
      onBack, onReplyChange, onSend, onToggleStatus }) {
      if (loading) {
        return (
          <div className="thread-view">
            <header className="thread-header">
              <button className="icon-button back-button" onClick={onBack} aria-label="Back to threads">
                <Icon name="arrow"/>
              </button>
            </header>
            <div className="loading-thread"><span><span className="loading-dot"></span>Opening conversation…</span></div>
          </div>
        );
      }

      if (!detail) {
        return (
          <div className="thread-view">
            <header className="thread-header">
              <button className="icon-button back-button" onClick={onBack} aria-label="Back to threads">
                <Icon name="arrow"/>
              </button>
            </header>
            <div className="empty-thread">
              <div className="empty-thread-card">
                <h2>Could not open this thread</h2>
                <p>{error || "Try selecting the conversation again."}</p>
              </div>
            </div>
          </div>
        );
      }

      const name = displayName(thread, detail);
      const resolved = detail.status === "resolved";

      return (
        <div className="thread-view">
          <header className="thread-header">
            <button className="icon-button back-button" onClick={onBack} aria-label="Back to threads">
              <Icon name="arrow"/>
            </button>
            <div className="thread-heading">
              <div className="thread-title-row">
                <h2 className="thread-title">{name}</h2>
                <span className={"status-chip" + (resolved ? " resolved" : "")}>
                  {resolved ? "Resolved" : "Open"}
                </span>
              </div>
              <p className="thread-uid">{detail.uid}</p>
            </div>
            <div className="toolbar">
              <button className={resolved ? "secondary-button" : "danger-button"}
                onClick={onToggleStatus} disabled={updatingStatus}>
                {updatingStatus ? "Updating…" : resolved ? "Reopen" : "Resolve"}
              </button>
            </div>
          </header>
          <div className="thread-grid">
            <Conversation detail={detail} name={name} reply={reply} sending={sending}
              actionError={error} onReplyChange={onReplyChange} onSend={onSend}/>
            <ContextPanel detail={detail}/>
          </div>
        </div>
      );
    }

    function NoThreadSelected() {
      return (
        <div className="empty-thread">
          <div className="empty-thread-card">
            <div className="empty-thread-icon"><Icon name="chat" size={25}/></div>
            <h2>Select a conversation</h2>
            <p>Open a thread to read the full history, review move context, and reply.</p>
          </div>
        </div>
      );
    }

    function SupportInbox({ user, initialThreads, onPermissionDenied, onSignOut }) {
      const [filter, setFilter] = useState("open");
      const [threads, setThreads] = useState(initialThreads);
      const [listLoading, setListLoading] = useState(false);
      const [refreshing, setRefreshing] = useState(false);
      const [listError, setListError] = useState("");
      const [selectedUid, setSelectedUid] = useState(null);
      const [detail, setDetail] = useState(null);
      const [threadLoading, setThreadLoading] = useState(false);
      const [threadError, setThreadError] = useState("");
      const [reply, setReply] = useState("");
      const [sending, setSending] = useState(false);
      const [updatingStatus, setUpdatingStatus] = useState(false);
      const listRequestId = useRef(0);
      const threadRequestId = useRef(0);
      const firstFilterEffect = useRef(true);

      const handleError = useCallback((error, fallback) => {
        if (isPermissionDenied(error)) {
          onPermissionDenied();
          return "This account isn't authorized.";
        }
        return readableError(error, fallback);
      }, [onPermissionDenied]);

      const refreshThreads = useCallback(async (showLoading = false) => {
        const requestId = ++listRequestId.current;
        showLoading ? setListLoading(true) : setRefreshing(true);
        setListError("");
        try {
          const payload = filter === "all" ? {} : { statusFilter: filter };
          const result = await adminListThreads(payload);
          const nextThreads = Array.isArray(result.data && result.data.threads)
            ? result.data.threads
            : [];
          if (requestId === listRequestId.current) setThreads(nextThreads);
        } catch (requestError) {
          if (requestId === listRequestId.current) {
            setListError(handleError(requestError, "Could not refresh support threads."));
          }
        } finally {
          if (requestId === listRequestId.current) {
            setListLoading(false);
            setRefreshing(false);
          }
        }
      }, [filter, handleError]);

      const loadThread = useCallback(async uid => {
        const requestId = ++threadRequestId.current;
        setThreadLoading(true);
        setThreadError("");
        try {
          const result = await adminGetThread({ uid });
          if (requestId !== threadRequestId.current) return null;
          const nextDetail = result.data;
          setDetail(nextDetail);
          setThreads(current => current.map(item =>
            item.uid === uid ? { ...item, unreadForAdmin: 0, status: nextDetail.status } : item
          ));
          return nextDetail;
        } catch (requestError) {
          if (requestId !== threadRequestId.current) return null;
          setDetail(null);
          setThreadError(handleError(requestError, "Could not open this support thread."));
          return null;
        } finally {
          if (requestId === threadRequestId.current) setThreadLoading(false);
        }
      }, [handleError]);

      useEffect(() => {
        if (firstFilterEffect.current) {
          firstFilterEffect.current = false;
          return;
        }
        refreshThreads(true);
      }, [filter, refreshThreads]);

      useEffect(() => {
        const interval = window.setInterval(() => {
          refreshThreads(false);
        }, 20000);
        return () => window.clearInterval(interval);
      }, [refreshThreads]);

      const selectThread = uid => {
        setSelectedUid(uid);
        setDetail(null);
        setReply("");
        loadThread(uid);
      };

      const closeThread = () => {
        threadRequestId.current += 1;
        setSelectedUid(null);
        setDetail(null);
        setThreadError("");
        setReply("");
        setThreadLoading(false);
      };

      const manualRefresh = async () => {
        await refreshThreads(false);
        if (selectedUid) await loadThread(selectedUid);
      };

      const sendReply = async () => {
        const text = reply.trim();
        if (!selectedUid || !text || sending) return;
        setSending(true);
        setThreadError("");
        try {
          await adminReplySupport({ uid: selectedUid, text });
          setReply("");
          await loadThread(selectedUid);
          await refreshThreads(false);
        } catch (requestError) {
          setThreadError(handleError(requestError, "Your reply was not sent. Try again."));
        } finally {
          setSending(false);
        }
      };

      const toggleStatus = async () => {
        if (!selectedUid || !detail || updatingStatus) return;
        const status = detail.status === "resolved" ? "open" : "resolved";
        setUpdatingStatus(true);
        setThreadError("");
        try {
          await adminSetThreadStatus({ uid: selectedUid, status });
          setDetail(current => current ? { ...current, status } : current);
          setThreads(current => current.map(item =>
            item.uid === selectedUid ? { ...item, status } : item
          ));
          await refreshThreads(false);
        } catch (requestError) {
          setThreadError(handleError(requestError, "Could not update the thread status."));
        } finally {
          setUpdatingStatus(false);
        }
      };

      const selectedThread = threads.find(item => item.uid === selectedUid) || (
        selectedUid ? { uid: selectedUid, userName: detail?.userContext?.name || "" } : null
      );

      return (
        <main className={"inbox" + (selectedUid ? " has-selection" : "")}>
          <ThreadList user={user} threads={threads} filter={filter}
            selectedUid={selectedUid} loading={listLoading} refreshing={refreshing}
            error={listError} onFilter={setFilter} onSelect={selectThread}
            onRefresh={manualRefresh} onSignOut={onSignOut}/>
          <section className="thread-pane" aria-label="Selected support thread">
            {selectedUid ? (
              <ThreadView thread={selectedThread} detail={detail} loading={threadLoading}
                error={threadError} reply={reply} sending={sending}
                updatingStatus={updatingStatus} onBack={closeThread}
                onReplyChange={setReply} onSend={sendReply} onToggleStatus={toggleStatus}/>
            ) : (
              <NoThreadSelected/>
            )}
          </section>
        </main>
      );
    }

    function AuthorizedApp({ user, onSignOut }) {
      const [state, setState] = useState({
        checking: true,
        denied: false,
        threads: [],
        error: ""
      });

      useEffect(() => {
        let active = true;
        adminListThreads({ statusFilter: "open" })
          .then(result => {
            if (!active) return;
            setState({
              checking: false,
              denied: false,
              threads: Array.isArray(result.data && result.data.threads) ? result.data.threads : [],
              error: ""
            });
          })
          .catch(error => {
            if (!active) return;
            setState({
              checking: false,
              denied: isPermissionDenied(error),
              threads: [],
              error: readableError(error, "Could not load the support inbox.")
            });
          });
        return () => {
          active = false;
        };
      }, [user.uid]);

      if (state.checking) return <LoadingScreen/>;
      if (state.denied) return <UnauthorizedScreen user={user} onSignOut={onSignOut}/>;
      if (state.error) {
        return (
          <main className="centered-screen">
            <section className="auth-card">
              <h1 className="auth-title">Support inbox unavailable</h1>
              <p className="auth-copy">{state.error}</p>
              <button className="secondary-button wide-button" onClick={onSignOut}>Sign out</button>
            </section>
          </main>
        );
      }

      return (
        <SupportInbox user={user} initialThreads={state.threads}
          onPermissionDenied={() => setState(current => ({ ...current, denied: true }))}
          onSignOut={onSignOut}/>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(firebaseConfigReady);

      useEffect(() => {
        if (!auth) return;
        return auth.onAuthStateChanged(nextUser => {
          setUser(nextUser);
          setLoading(false);
        });
      }, []);

      const signOut = async () => {
        if (auth) await auth.signOut();
      };

      if (loading) return <LoadingScreen label="Checking your session…"/>;
      if (!user) return <LoginScreen/>;
      return <AuthorizedApp key={user.uid} user={user} onSignOut={signOut}/>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
